<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Page</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0d0d0d;
            color: #e0e0e0;
            padding: 20px;
        }
        h1, h2 {
            color: #ff4444;
            text-shadow: 0 0 5px #ff0000;
        }
        textarea, input[type="text"] {
            width: 100%;
            font-size: 16px;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            box-sizing: border-box;
            margin-bottom: 20px;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }
        textarea:focus, input[type="text"]:focus {
            border-color: #ff4444;
            outline: none;
        }
        #output {
            padding: 15px;
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            min-height: 50px;
            font-size: 18px;
            color: #e0e0e0;
        }
        #submissions {
            padding: 10px;
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        button {
            background-color: #ff4444;
            color: #0d0d0d;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #ff0000;
        }
        .latex-input {
            color: #ff4444;
        }
        .response-output {
            color: #00ff00;
        }
    </style>
</head>
<body>
    <h1>Submission Page</h1>
    
    <div id="user-info">
        <h2>User Information</h2>
        <label for="first-name">First Name:</label>
        <input type="text" id="first-name" placeholder="Your first name" required><br><br>
        
        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name" placeholder="Your last name" required><br><br>
        
        <button onclick="saveUserInfo()">Save Information</button>
    </div>
    
    <div id="submission-form">
        <h2>Submit a Message</h2>
        <label for="latex-input">Write your LaTeX code below:</label><br>
        <textarea id="latex-input" oninput="renderMath()">$$ \frac{a}{b} $$</textarea><br><br>
        
        <button onclick="submitMessage()">Send</button>
    </div>

    <h2>Mathematical Rendering:</h2>
    <div id="output"></div>
    
    <h2>My Submissions and Responses</h2>
    <div id="submissions"></div>

    <script>
        let userInfo = JSON.parse(localStorage.getItem('userInfo')) || {};

        function renderMath() {
            const input = document.getElementById('latex-input').value;
            document.getElementById('output').innerHTML = input;
            MathJax.typesetPromise([document.getElementById('output')])
                .then(() => console.log('MathJax has finished rendering.'))
                .catch((err) => console.error('MathJax error:', err));
        }

        function saveUserInfo() {
            const firstName = document.getElementById('first-name').value;
            const lastName = document.getElementById('last-name').value;
            
            if (firstName && lastName) {
                userInfo = { firstName, lastName };
                localStorage.setItem('userInfo', JSON.stringify(userInfo));
                document.getElementById('user-info').style.display = 'none';
                loadSubmissions();
            }
        }

        function submitMessage() {
            if (!userInfo.firstName || !userInfo.lastName) {
                alert('Please enter your user information.');
                return;
            }

            const latexInput = document.getElementById('latex-input').value;
            const renderedLatex = `<div class="latex-input">${latexInput}</div>`;
            const submission = {
                firstName: userInfo.firstName,
                lastName: userInfo.lastName,
                latex: latexInput,
                renderedLatex: renderedLatex,
                date: new Date().toISOString(),
                response: null
            };
            
            let submissions = JSON.parse(localStorage.getItem('submissions') || '[]');
            submissions.push(submission);
            localStorage.setItem('submissions', JSON.stringify(submissions));
            
            document.getElementById('latex-input').value = '';
            document.getElementById('output').innerHTML = '';
            loadSubmissions();
        }

        function loadSubmissions() {
            const submissions = JSON.parse(localStorage.getItem('submissions') || '[]');
            const submissionsDiv = document.getElementById('submissions');
            submissionsDiv.innerHTML = '';
            
            submissions.forEach(submission => {
                const responseHtml = submission.response ? `
                    <div>
                        <div class="latex-input">${submission.response.latex}</div>
                        <p><strong>Response:</strong> <span class="response-output">${submission.response.text}</span></p>
                        <p><strong>Date:</strong> ${new Date(submission.response.date).toLocaleString()}</p>
                    </div>
                ` : '';

                const submissionHtml = `
                    <div>
                        <h3>Message from ${submission.firstName} ${submission.lastName}</h3>
                        <div class="latex-input">${submission.renderedLatex}</div>
                        <p><strong>Date:</strong> ${new Date(submission.date).toLocaleString()}</p>
                        ${responseHtml}
                    </div>
                `;
                submissionsDiv.innerHTML += submissionHtml;
            });

            MathJax.typesetPromise()
                .then(() => console.log('MathJax has finished rendering.'))
                .catch((err) => console.error('MathJax error:', err));
        }

        window.onload = function() {
            if (!userInfo.firstName || !userInfo.lastName) {
                document.getElementById('user-info').style.display = 'block';
            } else {
                document.getElementById('user-info').style.display = 'none';
            }
            loadSubmissions();
        };
    </script>
</body>
</html>
